<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>

    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="50%" stop-color="#FF9966" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="favGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.05" />
    </linearGradient>

    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF5E62" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" stroke="rgba(255, 153, 102, 0.3)" stroke-width="1.5" />

  <!-- Background Disc -->
  <circle cx="32" cy="32" r="22" fill="url(#favGlow)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Orbital Trajectory Ring -->
  <path d="M 18,42 A 16,16 0 1,1 46,24" fill="none" stroke="url(#favGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.9" />

  <!-- Compass Accent Dots -->
  <circle cx="32" cy="14" r="1.5" fill="#FBBF24" />
  <circle cx="50" cy="32" r="1.5" fill="#FF9966" />
  <circle cx="32" cy="50" r="1.5" fill="#FF5E62" />
  <circle cx="14" cy="32" r="1.5" fill="#FF9966" />

  <!-- Supersonic Jet -->
  <g filter="url(#favShadow)">
    <path d="M 36 16 L 41 27 L 51 31 L 42 34 L 41 42 L 36 37 L 30 45 L 31 35 L 22 34 L 32 29 Z" 
          fill="url(#favGrad)" />
    <!-- Wing Highlight -->
    <path d="M 36 16 L 37 35 L 42 34 L 51 31 L 41 27 Z" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- Speed Trail -->
  <path d="M 20 46 Q 26 42 31 35" fill="none" stroke="url(#favGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
