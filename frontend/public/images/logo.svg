<svg width="290" height="60" viewBox="0 0 290 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sunset Gradients -->
    <linearGradient id="tfGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="50%" stop-color="#FF9966" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="tfGradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="tfGradSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="tfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#FF5E62" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ==================== EMBLEM (Compass Jet Orbit) ==================== -->
  <g transform="translate(6, 6)">
    <!-- Background Glow Disc -->
    <circle cx="24" cy="24" r="23" fill="url(#tfGradGlow)" stroke="rgba(255, 153, 102, 0.2)" stroke-width="1.2" />

    <!-- Orbital Trajectory Ring -->
    <path d="M 10,34 A 18,18 0 1,1 40,16" fill="none" stroke="url(#tfGradPrimary)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.85" />
    
    <!-- Compass Pointer Accent Dots -->
    <circle cx="24" cy="4" r="1.8" fill="#FBBF24" />
    <circle cx="44" cy="24" r="1.8" fill="#FF9966" />
    <circle cx="24" cy="44" r="1.8" fill="#FF5E62" />
    <circle cx="4" cy="24" r="1.8" fill="#FF9966" />

    <!-- Dynamic Jet Vector -->
    <g filter="url(#tfShadow)">
      <path d="M 28 8 L 33 19 L 43 23 L 34 26 L 33 34 L 28 29 L 22 37 L 23 27 L 14 26 L 24 21 Z" 
            fill="url(#tfGradPrimary)" />
      <!-- Jet Wing Highlight Detail -->
      <path d="M 28 8 L 29 27 L 34 26 L 43 23 L 33 19 Z" fill="#FFE4B5" opacity="0.45" />
    </g>

    <!-- Jet Speed Trail -->
    <path d="M 12 38 Q 18 34 23 27" fill="none" stroke="url(#tfGradPrimary)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 8 41 Q 14 38 18 33" fill="none" stroke="url(#tfGradPrimary)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- ==================== TYPOGRAPHY WORDMARK ==================== -->
  <g transform="translate(68, 0)">
    <!-- Primary Brand Name: TOUR FEVER -->
    <text x="0" y="33" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="900" font-size="24" letter-spacing="1.5">
      <tspan fill="url(#tfGradSilver)">TOUR</tspan>
      <tspan dx="5" fill="url(#tfGradPrimary)">FEVER</tspan>
    </text>

    <!-- Tagline: LET YOUR JOURNEY BEGIN -->
    <text x="1" y="48" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="8" fill="#F59E0B" letter-spacing="2.2" opacity="0.95">
      LET YOUR JOURNEY BEGIN
    </text>
    
    <!-- Accent Line under Tagline -->
    <rect x="180" y="45" width="26" height="1.5" rx="0.75" fill="url(#tfGradPrimary)" />
  </g>
</svg>
